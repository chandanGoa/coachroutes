<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoachRoutes Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1E2A3A',
                        secondary: '#B48A3D',
                        accent: '#2C5282',
                    },
                    fontFamily: {
                        inter: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="font-inter bg-gray-100">
    <!-- Header -->
    <header class="bg-primary text-white shadow-lg">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold">
                <img src="images/logo-horizontal-transparent-bw.png" width="280px" alt="CoachRoutes">
            </a>
            <nav class="flex items-center space-x-6">
                <a href="index.html" class="hover:text-secondary transition duration-300">Public Site</a>
                <a href="admin.html" class="text-secondary font-semibold">Dashboard</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-primary mb-8">
            <i class="fas fa-tachometer-alt mr-2"></i>
            Admin Dashboard
        </h1>

        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            <div class="bg-white rounded-lg shadow-lg p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm">Total Coaches</p>
                        <h3 class="text-3xl font-bold text-primary" id="totalCoaches">-</h3>
                    </div>
                    <div class="bg-secondary bg-opacity-20 rounded-full p-4">
                        <i class="fas fa-bus text-secondary text-2xl"></i>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow-lg p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm">Active Drivers</p>
                        <h3 class="text-3xl font-bold text-primary" id="totalDrivers">-</h3>
                    </div>
                    <div class="bg-blue-100 rounded-full p-4">
                        <i class="fas fa-id-card text-blue-600 text-2xl"></i>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow-lg p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm">Total Bookings</p>
                        <h3 class="text-3xl font-bold text-primary" id="totalBookings">-</h3>
                    </div>
                    <div class="bg-green-100 rounded-full p-4">
                        <i class="fas fa-calendar-check text-green-600 text-2xl"></i>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow-lg p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm">Total Customers</p>
                        <h3 class="text-3xl font-bold text-primary" id="totalCustomers">-</h3>
                    </div>
                    <div class="bg-purple-100 rounded-full p-4">
                        <i class="fas fa-users text-purple-600 text-2xl"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="bg-white rounded-lg shadow-lg mb-8">
            <div class="flex border-b">
                <button onclick="showTab('coaches')" id="tab-coaches" class="tab-button px-6 py-4 font-semibold text-primary border-b-2 border-secondary">
                    <i class="fas fa-bus mr-2"></i>Coaches
                </button>
                <button onclick="showTab('drivers')" id="tab-drivers" class="tab-button px-6 py-4 font-semibold text-gray-600 hover:text-primary">
                    <i class="fas fa-id-card mr-2"></i>Drivers
                </button>
                <button onclick="showTab('bookings')" id="tab-bookings" class="tab-button px-6 py-4 font-semibold text-gray-600 hover:text-primary">
                    <i class="fas fa-calendar-check mr-2"></i>Bookings
                </button>
                <button onclick="showTab('customers')" id="tab-customers" class="tab-button px-6 py-4 font-semibold text-gray-600 hover:text-primary">
                    <i class="fas fa-users mr-2"></i>Customers
                </button>
                <button onclick="showTab('routes')" id="tab-routes" class="tab-button px-6 py-4 font-semibold text-gray-600 hover:text-primary">
                    <i class="fas fa-route mr-2"></i>Routes
                </button>
            </div>

            <!-- Coaches Tab -->
            <div id="content-coaches" class="tab-content p-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-bold">Fleet Management</h2>
                    <button class="bg-secondary hover:bg-yellow-700 text-white px-4 py-2 rounded-lg">
                        <i class="fas fa-plus mr-2"></i>Add Coach
                    </button>
                </div>
                <div id="coaches-table" class="overflow-x-auto">
                    <p class="text-gray-600">Loading...</p>
                </div>
            </div>

            <!-- Drivers Tab -->
            <div id="content-drivers" class="tab-content p-6 hidden">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-bold">Driver Management</h2>
                    <button class="bg-secondary hover:bg-yellow-700 text-white px-4 py-2 rounded-lg">
                        <i class="fas fa-plus mr-2"></i>Add Driver
                    </button>
                </div>
                <div id="drivers-table" class="overflow-x-auto">
                    <p class="text-gray-600">Loading...</p>
                </div>
            </div>

            <!-- Bookings Tab -->
            <div id="content-bookings" class="tab-content p-6 hidden">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-bold">Booking Management</h2>
                    <button class="bg-secondary hover:bg-yellow-700 text-white px-4 py-2 rounded-lg">
                        <i class="fas fa-plus mr-2"></i>New Booking
                    </button>
                </div>
                <div id="bookings-table" class="overflow-x-auto">
                    <p class="text-gray-600">Loading...</p>
                </div>
            </div>

            <!-- Customers Tab -->
            <div id="content-customers" class="tab-content p-6 hidden">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-bold">Customer Management</h2>
                    <button class="bg-secondary hover:bg-yellow-700 text-white px-4 py-2 rounded-lg">
                        <i class="fas fa-plus mr-2"></i>Add Customer
                    </button>
                </div>
                <div id="customers-table" class="overflow-x-auto">
                    <p class="text-gray-600">Loading...</p>
                </div>
            </div>

            <!-- Routes Tab -->
            <div id="content-routes" class="tab-content p-6 hidden">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-bold">Route Management</h2>
                    <button class="bg-secondary hover:bg-yellow-700 text-white px-4 py-2 rounded-lg">
                        <i class="fas fa-plus mr-2"></i>Add Route
                    </button>
                </div>
                <div id="routes-table" class="overflow-x-auto">
                    <p class="text-gray-600">Loading...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';

        // Tab switching
        function showTab(tabName) {
            // Hide all tab contents
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.add('hidden');
            });
            
            // Remove active class from all tab buttons
            document.querySelectorAll('.tab-button').forEach(button => {
                button.classList.remove('text-primary', 'border-b-2', 'border-secondary');
                button.classList.add('text-gray-600');
            });
            
            // Show selected tab content
            document.getElementById(`content-${tabName}`).classList.remove('hidden');
            
            // Add active class to selected tab button
            const activeButton = document.getElementById(`tab-${tabName}`);
            activeButton.classList.remove('text-gray-600');
            activeButton.classList.add('text-primary', 'border-b-2', 'border-secondary');
            
            // Load data for the tab
            loadTabData(tabName);
        }

        // Load stats
        async function loadStats() {
            try {
                const [coaches, drivers, bookings, customers] = await Promise.all([
                    fetch(`${API_BASE}/coaches`).then(r => r.json()),
                    fetch(`${API_BASE}/drivers`).then(r => r.json()),
                    fetch(`${API_BASE}/bookings`).then(r => r.json()),
                    fetch(`${API_BASE}/customers`).then(r => r.json()),
                ]);

                document.getElementById('totalCoaches').textContent = coaches.length;
                document.getElementById('totalDrivers').textContent = drivers.filter(d => d.status === 'active').length;
                document.getElementById('totalBookings').textContent = bookings.length;
                document.getElementById('totalCustomers').textContent = customers.length;
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        // Load tab data
        async function loadTabData(tabName) {
            const tableId = `${tabName}-table`;
            const tableEl = document.getElementById(tableId);

            try {
                const response = await fetch(`${API_BASE}/${tabName}`);
                const data = await response.json();

                if (data.length === 0) {
                    tableEl.innerHTML = '<p class="text-gray-600">No data available</p>';
                    return;
                }

                // Generate table HTML
                let html = '<table class="min-w-full bg-white"><thead class="bg-gray-100"><tr>';
                
                // Get columns from first item
                const columns = Object.keys(data[0]);
                columns.forEach(col => {
                    html += `<th class="px-4 py-2 text-left text-xs font-semibold text-gray-700 uppercase">${col.replace(/_/g, ' ')}</th>`;
                });
                html += '</tr></thead><tbody>';

                // Add rows
                data.forEach(item => {
                    html += '<tr class="border-b hover:bg-gray-50">';
                    columns.forEach(col => {
                        let value = item[col];
                        if (value === null || value === undefined) value = '-';
                        if (col.includes('date') || col.includes('datetime')) {
                            value = new Date(value).toLocaleString();
                        }
                        html += `<td class="px-4 py-2 text-sm">${value}</td>`;
                    });
                    html += '</tr>';
                });

                html += '</tbody></table>';
                tableEl.innerHTML = html;
            } catch (error) {
                console.error(`Error loading ${tabName}:`, error);
                tableEl.innerHTML = `<p class="text-red-600">Error loading data: ${error.message}</p>`;
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadStats();
            loadTabData('coaches');
        });
    </script>
</body>
</html>
